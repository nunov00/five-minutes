name: 10k prerender compact-search benchmark
on:
  pull_request:
    paths:
      - 'benchmark/**'
      - 'src/pages/**'
      - 'src/content.config.ts'
      - 'astro.config.mjs'
      - 'package.json'
      - '.github/workflows/benchmark-10k.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Generate 10k realistic-vocabulary lessons with two editions
        run: npm run generate
      - name: Astro full prerender build
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v npm run build 2>&1 | tee astro-build.log
      - name: Compact metadata MiniSearch benchmark
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v npm run index 2>&1 | tee search.log
      - name: Measure output
        shell: bash
        run: |
          set -o pipefail
          npm run measure 2>&1 | tee measurements.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prerender-compact-search-benchmark-results
          if-no-files-found: warn
          path: |
            benchmark-results.json
            search-benchmark-results.json
            astro-build.log
            search.log
            measurements.log
