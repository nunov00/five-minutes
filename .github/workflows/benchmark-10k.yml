name: 10k hybrid architecture benchmark
on:
  pull_request:
    paths:
      - 'benchmark/**'
      - 'src/pages/lesson/**'
      - 'src/content.config.ts'
      - 'astro.config.mjs'
      - 'package.json'
      - '.github/workflows/benchmark-10k.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Generate 10k synthetic lessons
        run: npm run generate
      - name: Astro build
        run: /usr/bin/time -v npm run build 2>&1 | tee astro-build.log
      - name: Pagefind index
        run: /usr/bin/time -v npm run index 2>&1 | tee pagefind.log
      - name: Measure output
        run: npm run measure | tee measurements.log
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results.json
            astro-build.log
            pagefind.log
            measurements.log
