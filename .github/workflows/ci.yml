name: CI

# Production quality gates for every pull request and for main:
# `baseline` (install, check, unit tests, build) then `e2e` (Playwright).
# The 10k architecture benchmarks (benchmark-*.yml) are manual-only and are
# intentionally not part of this workflow.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token; this workflow uses no repository secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    # Stable check name for branch protection and publication automation.
    name: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Astro/TypeScript check (npm run check)
        run: npm run check

      - name: Unit/integration tests (npm test)
        run: npm test

      - name: Production static build (npm run build)
        run: npm run build

      - name: Deployable file count (npm run dist:count)
        run: npm run dist:count

  e2e:
    # Stable check name for branch protection and publication automation.
    name: e2e
    # Browser journeys only run once the baseline gates pass.
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Production static build (npm run build)
        run: npm run build

      - name: Playwright E2E against built site (npm run test:e2e)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
