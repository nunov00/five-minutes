name: CI

# Production quality gates for every pull request and for main:
# `baseline` (install, check, unit tests, build) then `e2e` (Playwright).
# Architecture-scale benchmark workflows remain manual and separate from this gate.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    # Stable check name used by branch protection/publication automation.
    name: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://example.test
      CONTENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || github.sha) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund
      - name: Astro/TypeScript check (npm run check)
        run: npm run check
      - name: Unit/integration tests (npm test)
        run: npm test
      - name: Verify origin-absent build and metadata
        env:
          SITE_URL: ""
        run: npm run build && npm run verify:static
      - name: Production static build (npm run build)
        run: npm run build
      - name: Verify static completeness and internal links (npm run verify:static)
        run: npm run verify:static
      - name: Compile Cloudflare delivery artifacts (npm run cf:prepare)
        run: npm run cf:prepare
      - name: Verify built delivery artifacts
        run: node deploy/cloudflare/verify-redirects.mjs
      - name: Verify Cloudflare hosting capacity
        run: npm run cf:verify-capacity
      - name: Deployable file count with early warning
        run: node scripts/count-dist-files.mjs --warn-at 16000

  e2e:
    # Stable check name used by branch protection/publication automation.
    name: e2e
    needs: baseline
    env:
      SITE_URL: https://example.test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium, WebKit and system dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Production static build (npm run build)
        # Exercise real multi-page Library rendering while the seed catalogue
        # remains smaller than the production page size.
        run: FIVE_MINUTES_TEST_LIBRARY_PAGE_SIZE=5 npm run build
      - name: Playwright E2E against built site (npm run test:e2e)
        run: npm run test:e2e
      - name: Upload exact-head figure renders for editorial review
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('test-results/**/visual-*.png') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: figure-renders-${{ github.event.pull_request.head.sha }}
          path: test-results/**/visual-*.png
          retention-days: 3
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
