name: Astro scaling benchmark
on:
  pull_request:
    paths:
      - 'benchmark/**'
      - 'src/pages/**'
      - 'src/content.config.ts'
      - 'astro.config.mjs'
      - 'package.json'
      - '.github/workflows/benchmark-scale.yml'
  workflow_dispatch:
jobs:
  scale:
    strategy:
      fail-fast: false
      matrix:
        lessons: [1000, 5000, 10000]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LESSON_COUNT: ${{ matrix.lessons }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Generate corpus
        run: npm run generate
      - name: Full prerender
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v npm run build 2>&1 | tee astro-build-${LESSON_COUNT}.log
      - name: Measure successful build
        run: node benchmark/measure-scale.mjs | tee scale-${LESSON_COUNT}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astro-scale-${{ matrix.lessons }}
          if-no-files-found: warn
          path: |
            astro-build-*.log
            scale-*.json
            scale-*.log
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LESSON_COUNT: 10000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate
      - name: Compact search independently
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v npm run index 2>&1 | tee search.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-search-independent
          if-no-files-found: warn
          path: |
            search-benchmark-results.json
            search.log
