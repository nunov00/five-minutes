name: Assemble sharded static site
on: workflow_dispatch
jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    env:
      LESSON_COUNT: 10000
      SHARD_COUNT: 4
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - run: node benchmark/generate-shard.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: {name: "site-shard-${{ matrix.shard }}", path: "dist/"}
  assemble:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: {pattern: "site-shard-*", path: "incoming"}
      - run: node benchmark/assemble-shards.mjs
      - run: npm run generate
        env: {LESSON_COUNT: 10000}
      - run: npm run index
      - run: node benchmark/validate-assembled.mjs
