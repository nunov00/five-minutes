sources:
  - title: Photophysics of Structural Color in the Morpho Butterflies
    url: https://forma.katachi-jp.com/pdf/1702/17020103.pdf
    publisher: Forma — Kinoshita, Yoshioka, Fujii and Okamoto (2002)
    accessedAt: 2026-10-23
    note: "Full paper read: section 3.1 and figures 3–4 support the cuticle-and-air ridge anatomy and unequal
      heights; sections 4.1 and 5 support interference with diffraction and model limits; section 4.3 supports
      pigment enhancing blue contrast. Diagrams are original qualitative drawings, not copied figures."
  - title: Morphing Butterfly
    url: https://www.nisenet.org/sites/default/files/catalog/uploads/9881/diy_nano_print_butterfly_03_21.pdf
    publisher: NISE Network / Sciencenter (2012)
    accessedAt: 2026-10-23
    note: Page 3 supports the reported isopropyl-alcohol blue–green–blue sequence and clear liquid filling gaps.
      The lesson gives no home procedure and copies no photographs. The guide does not identify a particular
      Morpho species.
  - title: Scientific Image — Blue Morpho Butterfly Wing (non-reflected light)
    url: https://www.nisenet.org/catalog/scientific-image-blue-morpho-butterfly-wing-non-reflected-light
    publisher: NISE Network / F. Nijhout, Duke University
    accessedAt: 2026-10-23
    note: Supports brown pigment becoming visible in transmitted light. Its photograph is not reproduced; brown
      appearance alone is not used to prove the blue mechanism.
  - title: Effects of Measurement Configurations on the Sensitivity of Morpho Butterfly Scales Based Chemical
      Biosensor
    url: https://www.frontiersin.org/journals/physics/articles/10.3389/fphy.2021.806904/full
    publisher: Frontiers in Physics — Dong et al. (published 5 January 2022; volume 9, 2021)
    accessedAt: 2026-10-24
    note: Model and simulations examine changes in the surrounding medium. Supports a qualitative
      longer-wavelength shift for relevant viewing conditions; also shows that direction/size of a shift is
      not universal across measurement angles. Its methanol/ethanol comparison is not treated as an
      isopropyl-alcohol measurement. NISE remains the source for that demonstration. No peak wavelengths or
      numerical prediction are asserted. The research ending uses its RCWA model of surrounding media and
      measurement geometry; the conclusion explicitly leaves experiments to verify the proposed measurement
      improvements to future work. No functioning product or established sensing performance is claimed.
      Simulations and Discussions, the text around Figures 9 and 10B, explicitly balances spectral-peak
      separation against a longer continuous angle range to accommodate uncertainty in instrument angles.
      This supports the existing phrase about tolerating small angle errors. The Conclusion describes
      robustness as theoretical and leaves experimental verification to future work.
  - title: Interference in Thin Films — University Physics Volume 3, section 3.4
    url: https://openstax.org/books/university-physics-volume-3/pages/3-4-interference-in-thin-films
    publisher: OpenStax / Rice University
    accessedAt: 2026-10-23
    note: Supports the optical principle that relative phase depends on travel paths, refractive indices and
      wavelength, including phase changes on reflection. Used for the separate qualitative dry/wet timing
      sketch, not as a model of Morpho anatomy. Both colours are already present in white light; each keeps
      its wavelength on returning to the same observing medium. No source figure is copied. The sketch's
      illustrative phases and spacings are not measured wing parameters or a calculated reflection spectrum.
